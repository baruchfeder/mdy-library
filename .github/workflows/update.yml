# Twice a day: fetch new videos from YouTube, classify, rebuild site/videos.json, publish to GitHub Pages.
# Needs the repository secret YOUTUBE_API_KEY (Settings → Secrets and variables → Actions)
# and Pages source "GitHub Actions" (Settings → Pages).
name: Daily update

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC (07:00/08:00 Israel)
    - cron: "0 17 * * *"  # 17:00 UTC — picks up the edited uploads during the day
  workflow_dispatch:       # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch new videos from YouTube
        if: github.event_name != 'push'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch.mjs

      - name: Classify and build videos.json
        run: |
          node scripts/classify.mjs > /dev/null
          node scripts/build.mjs

      - name: Save updated data to the repository
        if: github.event_name != 'push'
        run: |
          git config user.name "mdy-library-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/videos.json
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Daily update $(date -u +%F)" && git push; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
