<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ספריית שיעורי MDY</title>
<meta name="description" content="ספריית שיעורי הדף היומי של הרב אלי סטפנסקי, מרכז דף יומי (MDY) · Daf Yomi shiurim library of Rabbi Eli Stefansky">
<link rel="preconnect" href="https://www.youtube-nocookie.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Frank+Ruhl+Libre:wght@700;900&display=swap">
<style>
/* Layout: navy bar (logo · language · today) → picker strip → one focused lesson card
   (title + boxed daf number, five track tabs, big player, prev/next, collapsible daf grid) → library cards → footer */
:root{
  --bg:#F7F4EC; --card:#FFFFFF; --soft:#F1EEE6; --line:#E6E1D4; --ink:#14253D; --muted:#7A8291;
  --navy:#0B1F3A; --deep:#061E36; --gold:#E2BC4E; --gold-d:#B8902A; --cyan:#00A9C6; --blue:#005FCB;
  --off:#E4E0D6; --off-ink:#ABA697; --on-navy:#FFFFFF;
  --f-ui:"Assistant","Segoe UI",Arial,sans-serif;
  --f-daf:"Frank Ruhl Libre","David","Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07111D; --card:#0E1B2C; --soft:#132338; --line:#1F3149; --ink:#E8EDF4; --muted:#8E9AAB;
  --navy:#1B3A63; --off:#152234; --off-ink:#4E5D72; --blue:#5AA3FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07111D; --card:#0E1B2C; --soft:#132338; --line:#1F3149; --ink:#E8EDF4; --muted:#8E9AAB;
  --navy:#1B3A63; --off:#152234; --off-ink:#4E5D72; --blue:#5AA3FF; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--deep)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--deep);box-shadow:0 2px 10px rgba(6,30,54,.25)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.bar img{height:44px;width:auto;display:block}
.bar-actions{display:flex;align-items:center;gap:10px}
.lang-btn{background:none;border:1px solid rgba(226,188,78,.6);color:var(--gold);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.85rem}
.lang-btn:hover{background:rgba(226,188,78,.12)}
.today-btn{display:flex;align-items:center;gap:8px;background:var(--gold);color:var(--deep);border:0;border-radius:999px;padding:8px 18px;font-weight:800;font-size:.95rem;box-shadow:0 4px 14px -4px rgba(226,188,78,.6);transition:transform .15s}
.today-btn:hover{transform:translateY(-1px)}
.today-btn svg{width:18px;height:18px}

/* picker */
.picker{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
.field{display:grid;gap:3px;min-width:0}
.field label{font-size:.75rem;color:var(--muted);font-weight:600}
select{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:96px}
#mas{min-width:130px}
.search{position:relative;flex:1;min-width:200px;max-width:340px;margin-inline-start:auto}
.search input{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.sr{position:absolute;top:calc(100% + 4px);inset-inline:0;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px -12px rgba(6,30,54,.35);padding:4px;max-height:260px;overflow:auto}
.sr[hidden]{display:none}
.sr button{display:block;width:100%;text-align:start;background:none;border:0;padding:8px 10px;border-radius:6px}
.sr button:hover,.sr button:focus-visible{background:var(--soft)}
.sr .none{padding:8px 10px;color:var(--muted);font-size:.9rem}

/* lesson card */
.lesson{max-width:900px;margin:22px auto 0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 20px 50px -30px rgba(6,30,54,.35)}
.lhead{text-align:center;display:grid;gap:6px;justify-items:center}
.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.14em;color:var(--gold-d)}
.eyebrow.today{color:var(--cyan)}
.title{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.title h1{margin:0;font-size:clamp(1.6rem,4vw,2.1rem);font-weight:800;line-height:1.2}
.dafbox{font-family:var(--f-daf);font-weight:900;font-size:1.5rem;line-height:1;border:1.5px solid var(--ink);outline:1px solid var(--ink);outline-offset:3px;padding:6px 12px 8px;margin:4px}
.lsub{color:var(--muted);font-size:.92rem;margin:0}

.tracks{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:20px 0}
.tracks button{border:1px solid transparent;background:var(--soft);color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:600;font-size:.92rem;white-space:nowrap}
.tracks button:hover{border-color:var(--line)}
.tracks button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.tracks button.off{background:var(--off);color:var(--off-ink);text-decoration:line-through;text-decoration-thickness:1px}
.tracks button.off[aria-pressed="true"]{outline:2px solid var(--off-ink);outline-offset:1px;text-decoration:none}

.player{position:relative;display:block;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;text-decoration:none;color:#fff;
  background:radial-gradient(80% 110% at 75% 20%,#16406E 0%,#0B1F3A 55%,#061E36 100%)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(60,240,240,.34) 1px,transparent 1.5px);background-size:12px 12px;
  mask-image:radial-gradient(ellipse at 68% 45%,#000 0,transparent 70%)}
.player::after{content:"";position:absolute;width:62%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(60,240,240,.09);left:50%;top:50%;transform:translate(-30%,-50%)}
.pin{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;z-index:1}
.pbrand{font-size:.68rem;letter-spacing:.3em;color:#8EA2BB;font-weight:700;margin-bottom:16px}
.pplay{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.55);display:grid;place-items:center;margin:0 auto 16px;transition:transform .2s,background .2s}
.player:hover .pplay{transform:scale(1.07);background:rgba(255,255,255,.16)}
.pplay::after{content:"";border-style:solid;border-width:12px 0 12px 20px;border-color:transparent transparent transparent var(--gold);margin-left:5px;transform:scaleX(-1)}
.ptitle{font-family:var(--f-daf);font-weight:900;font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.1;color:#F1E6C6}
.pen{color:#A9B8CB;font-size:.95rem;margin-top:4px;direction:ltr}
.phint{color:#7C90A8;font-size:.8rem;margin-top:16px}
.player.off{background:var(--off);color:var(--off-ink)}
.player.off::before,.player.off::after{display:none}
.player.off .ptitle,.player.off .pen,.player.off .phint,.player.off .pbrand{color:var(--off-ink)}

.lfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:14px}
.navb{background:none;border:0;color:var(--muted);font-weight:600;padding:6px 0}
.navb:hover{color:var(--ink)}
.state{display:flex;align-items:center;gap:7px;font-size:.82rem;color:var(--muted)}
.state::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}
.state.off::before{background:var(--off-ink)}

details{border-top:1px solid var(--line);margin-top:14px}
summary{list-style:none;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px;padding:16px 0 6px;font-weight:700}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--cyan);font-size:1.2rem;line-height:1}
details[open] summary::after{content:"−"}
.legend{display:flex;justify-content:center;gap:18px;font-size:.8rem;color:var(--muted);margin:8px 0 14px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.legend .t{background:var(--soft);box-shadow:inset 0 -3px 0 var(--gold)} .legend .o{background:var(--off)}
.grid{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:5px}
.grid button{height:38px;min-width:0;border:1px solid var(--line);background:var(--soft);border-radius:6px;font-family:var(--f-daf);font-weight:700;font-size:1rem}
.grid button:hover{border-color:var(--cyan)}
.grid button.today{box-shadow:inset 0 -3px 0 var(--gold)}
.grid button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.grid button.off{background:var(--off);color:var(--off-ink);border-color:transparent}
.grid button.off[aria-pressed="true"]{outline:2px solid var(--off-ink);outline-offset:-2px}

.player[role="button"]{cursor:pointer}
.player.playing{background:#000}
.player.playing::before,.player.playing::after{display:none}
.player iframe{z-index:2}
.state a{color:var(--cyan);font-weight:700;text-decoration:none}
.state a:hover{text-decoration:underline}
.topic[aria-expanded="true"]{box-shadow:0 0 0 2px var(--cyan)}
.xlist{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.xlist[hidden]{display:none}
.xhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.xhead b{font-size:1.1rem}.xhead span{color:var(--muted);font-size:.85rem}
.xclose{margin-inline-start:auto;background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--muted);font-size:.85rem}
.xitems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.xitem{display:flex;gap:12px;align-items:center;text-align:start;background:var(--soft);border:1px solid transparent;border-radius:10px;padding:8px;min-width:0}
.xitem:hover{border-color:var(--cyan)}
.xitem[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.xitem img{width:120px;height:68px;object-fit:cover;border-radius:6px;flex:none;background:var(--off)}
.xitem span{display:grid;gap:2px;min-width:0}
.xitem b{font-weight:600;font-size:.92rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.xitem small{color:var(--muted);font-size:.8rem}
.xmore{display:block;margin:14px auto 0;background:var(--navy);color:var(--on-navy);border:0;border-radius:999px;padding:8px 20px;font-weight:700}
@media (max-width:700px){.xitems{grid-template-columns:1fr}.xitem img{width:96px;height:54px}}
.proto{max-width:760px;margin:16px auto 0;text-align:center;font-size:.82rem;color:var(--muted)}

/* library */
.library{margin-top:44px;background:var(--soft);border-top:1px solid var(--line);padding-block:34px 40px}
.shead{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.shead h2{margin:0;font-size:1.3rem;white-space:nowrap}
.shead::after{content:"";flex:1;height:1px;background:var(--line)}
.topics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.topic{display:grid;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .18s,box-shadow .18s}
.topic:hover{transform:translateY(-3px);box-shadow:0 14px 28px -18px rgba(6,30,54,.5)}
.art{position:relative;height:118px;display:grid;place-items:center;font-weight:800;font-size:1.55rem;letter-spacing:-.01em;overflow:hidden;direction:ltr}
.art::before{content:"";position:absolute;inset:0;background-image:radial-gradient(currentColor .9px,transparent 1.3px);background-size:11px 11px;opacity:.18;mask-image:radial-gradient(circle at 70% 40%,#000,transparent 70%)}
.art span{position:relative}
.a1{background:#0B1F3A;color:var(--gold)} .a2{background:#0090AB;color:#fff} .a3{background:var(--gold);color:#0B1F3A} .a4{background:#061E36;color:#fff}
.tbody{padding:14px 16px 16px;display:grid;gap:3px}
.tbody small{font-size:.72rem;font-weight:800;letter-spacing:.1em;color:var(--cyan)}
.tbody b{font-size:1.02rem;color:var(--ink)}
.tbody span{font-size:.85rem;color:var(--muted)}

footer{background:var(--card);border-top:1px solid var(--line)}
footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:20px;font-size:.85rem;color:var(--muted)}
footer img{height:52px;width:auto}

@media (max-width:860px){.topics{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(10,minmax(0,1fr))}}
@media (max-width:600px){
  .bar img{height:36px}.today-btn span{display:none}.today-btn{padding:8px 12px}
  .picker{padding:12px}.field{flex:1}select,#mas{min-width:0;width:100%}.search{flex-basis:100%;max-width:none}
  .lesson{padding:18px 14px;border-radius:16px}
  .tracks{display:grid;grid-template-columns:1fr 1fr}.tracks button{white-space:normal}
  .tracks button:last-child:nth-child(odd){grid-column:1/-1}
  .grid{grid-template-columns:repeat(7,minmax(0,1fr))}
  .pplay{width:56px;height:56px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  topics:[["8min","8 Minute Daf","תמצית","הדף בשמונה דקות","סיכומי הדף הקצרים מ־2019, באנגלית ובעברית"],["talks","Talks","שיחות","שיחות וראיונות","דברי תורה על הפרשה וראיונות עם הרב אלי"],["chizuk","Chizuk","השראה","שיחות חיזוק","קטעי חיזוק קצרים מהרב אלי"],["siyumim","Siyum","שמחה","סיומי מסכת","מעמדי הסיום של הלומדים"]],
  videos:"סרטונים",more:"הצג עוד",close:"סגירה",playing:"מתנגן עכשיו"},
 en:{seder:"Seder",mas:"Masechta",daf:"Daf",search:"Search",ph:"Bechoros 50 · בבא בתרא מה",today:"Today's Shiur",todayEye:"TODAY'S DAF YOMI",eye:"MASECHTA & DAF",masP:"Masechta",dafP:"Daf",
  prev:"← Previous daf",next:"Next daf →",grid:"All dafim of",lgToday:"Today's daf",lgOff:"No shiur",avail:"Available on YouTube",offState:"No shiur for this daf",
  hint:"Click to play the shiur",offHint:"No shiur in this series for this daf",none:"No masechta found",lib:"More Shiurim",
  proto:"",updated:"The list updates automatically from the YouTube channel · last update",min:"min",parts:"More parts",part:"Part",prevCycle:"previous cycle",loadErr:"Could not load the shiurim list. Please refresh the page.",
  speakers:{"Noam Fix":"R' Noam Fix","Menachem Mateh":"R' Menachem Mateh","Menachem Mathe":"R' Menachem Mateh","Yedidya Kramer":"R' Yedidya Kramer","av Chait":"Rav Chait"},
  foot:"Mercaz Daf Yomi · Rabbi Eli Stefansky",langBtn:"עברית",
  tracks:{"he-full":"Hebrew · Full Shiur","he-only":"Hebrew · Daf Only","en-full":"English · Full Shiur","en-only":"English · Daf Only (~35 min)","en-8":"8 Minute Daf"},
  topics:[["8min","8 Minute Daf","SUMMARY","The Daf in 8 Minutes","Short daf summaries from 2019, in English and Hebrew"],["talks","Talks","TALKS","Talks & Interviews","Parsha talks and interviews with Reb Eli"],["chizuk","Chizuk","INSPIRATION","Chizuk Clips","Short words of inspiration from Reb Eli"],["siyumim","Siyum","SIMCHA","Siyum Masechta","Celebrations of completing a masechta"]],
  videos:"videos",more:"Show more",close:"Close",playing:"Now playing"}
};
const TRACKS=[
 {id:"he-full",lang:"he",q:(m,d)=>`${m.he} דף ${gem(d)}`},
 {id:"he-only",lang:"he",q:(m,d)=>`${m.he} דף ${gem(d)} רק הדף`},
 {id:"en-full",lang:"en",q:(m,d)=>`Daf Yomi ${m.en} Daf ${d}`},
 {id:"en-only",lang:"en",q:(m,d)=>`${m.en} ${d} Daf Only`},
 {id:"en-8",lang:"en",q:(m,d)=>`8 Minute Daf ${m.en} ${d}`},
];
// Real data: videos.json (built daily by scripts/build.mjs) → VIDEOS["en-full"]["Chullin-130"]={id,t,d,m,c?,s?,alt?}
let VIDEOS={},EXTRAS={},GENERATED=null;
const SEDARIM=[["זרעים","Zeraim"],["מועד","Moed"],["נשים","Nashim"],["נזיקין","Nezikin"],["קדשים","Kodashim"],["טהרות","Taharos"]];
const SHAS=[
["Berachos","ברכות",2,64,0,"Berachot Brachos"],
["Shabbos","שבת",2,157,1,"Shabbat Shabbath"],["Eruvin","עירובין",2,105,1,"Eiruvin"],["Pesachim","פסחים",2,121,1,"Pesahim"],["Shekalim","שקלים",2,22,1,""],["Yoma","יומא",2,88,1,""],["Sukkah","סוכה",2,56,1,"Sukka Succah"],["Beitzah","ביצה",2,40,1,"Beitza Beitza"],["Rosh Hashanah","ראש השנה",2,35,1,"Rosh Hashana"],["Taanis","תענית",2,31,1,"Taanit"],["Megillah","מגילה",2,32,1,"Megila"],["Moed Katan","מועד קטן",2,29,1,""],["Chagigah","חגיגה",2,27,1,"Chagiga Hagigah"],
["Yevamos","יבמות",2,122,2,"Yevamot"],["Kesubos","כתובות",2,112,2,"Ketubot Kesuvos"],["Nedarim","נדרים",2,91,2,""],["Nazir","נזיר",2,66,2,""],["Sotah","סוטה",2,49,2,"Sota"],["Gittin","גיטין",2,90,2,"Gitin"],["Kiddushin","קידושין",2,82,2,"Kidushin"],
["Bava Kamma","בבא קמא",2,119,3,"Bava Kama Baba Kama"],["Bava Metzia","בבא מציעא",2,119,3,"Baba Metzia"],["Bava Basra","בבא בתרא",2,176,3,"Bava Batra Baba Basra"],["Sanhedrin","סנהדרין",2,113,3,""],["Makkos","מכות",2,24,3,"Makkot Makos"],["Shevuos","שבועות",2,49,3,"Shevuot Shavuos"],["Avodah Zarah","עבודה זרה",2,76,3,"Avoda Zara"],["Horayos","הוריות",2,14,3,"Horayot"],
["Zevachim","זבחים",2,120,4,"Zevahim"],["Menachos","מנחות",2,110,4,"Menachot"],["Chullin","חולין",2,142,4,"Chulin Hullin"],["Bechoros","בכורות",2,61,4,"Bechorot Bekhorot"],["Arachin","ערכין",2,34,4,"Arakhin Erchin"],["Temurah","תמורה",2,34,4,"Temura"],["Kereisos","כריתות",2,28,4,"Keritot Krisos"],["Meilah","מעילה",2,22,4,"Meila"],["Kinnim","קינים",23,25,4,"Kinim"],["Tamid","תמיד",26,33,4,""],["Middos","מידות",34,37,4,"Middot Midos"],
["Niddah","נדה",2,73,5,"Nidah Nida"]
].map(([en,he,s,e,o,al],i)=>({i,en,he,s,e,o,names:[he,en.toLowerCase(),...al.toLowerCase().split(" ").filter(Boolean)]}));

function gem(n){const H=[[400,"ת"],[300,"ש"],[200,"ר"],[100,"ק"],[90,"צ"],[80,"פ"],[70,"ע"],[60,"ס"],[50,"נ"],[40,"מ"],[30,"ל"],[20,"כ"],[10,"י"],[9,"ט"],[8,"ח"],[7,"ז"],[6,"ו"],[5,"ה"],[4,"ד"],[3,"ג"],[2,"ב"],[1,"א"]];
 let s="";for(const[v,c]of H){while(n>=v){if(v===10&&(n%100===15||n%100===16)){s+=n%100===15?"טו":"טז";n-=n%100;continue}s+=c;n-=v}}return s}
const gemQ=n=>{const s=gem(n);return s.length>1?s.slice(0,-1)+"״"+s.slice(-1):s+"׳"};
const VAL={א:1,ב:2,ג:3,ד:4,ה:5,ו:6,ז:7,ח:8,ט:9,י:10,כ:20,ל:30,מ:40,נ:50,ס:60,ע:70,פ:80,צ:90,ק:100,ר:200,ש:300,ת:400};
function dafForDate(d){const day=Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2020,0,5))/864e5);
 let idx=((day%2711)+2711)%2711;for(const m of SHAS){const len=m.e-m.s+1;if(idx<len)return{m,d:m.s+idx};idx-=len}}
const today=dafForDate(new Date());
const vidOf=(tr,m,d)=>(VIDEOS[tr.id]||{})[`${m.en}-${d}`]||null;
const has=(tr,m,d)=>!!vidOf(tr,m,d);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate=s=>{const[y,mo,d]=s.split("-");return `${+d}.${+mo}.${y}`};
const anyTrack=(m,d)=>TRACKS.some(t=>has(t,m,d));
const yt=q=>`https://www.youtube.com/${CHANNEL}/search?query=${encodeURIComponent(q)}`;
const $=id=>document.getElementById(id);

const st={mas:today.m.i,daf:today.d,track:"he-full",ui:"he"};
try{const s=JSON.parse(localStorage.getItem("mdy4")||"null");if(s){st.track=s.track||st.track;st.ui=s.ui||st.ui}}catch(e){}
const save=()=>{try{localStorage.setItem("mdy4",JSON.stringify({track:st.track,ui:st.ui}))}catch(e){}};
const mName=m=>st.ui==="he"?m.he:m.en;
const dName=d=>st.ui==="he"?gemQ(d):String(d);

function applyUI(){
  const L=T[st.ui];document.documentElement.lang=st.ui;document.documentElement.dir=st.ui==="he"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=L[el.dataset.t]);
  $("q").placeholder=L.ph;$("langBtn").textContent=L.langBtn;$("prev").textContent=L.prev;$("next").textContent=L.next;
  $("todayLbl").textContent=`${L.today} · ${mName(today.m)} ${dName(today.d)}`;
  renderTopics();
}
function renderTopics(){const L=T[st.ui];
  $("topics").innerHTML=L.topics.map((t,k)=>{const n=(EXTRAS[t[0]]||[]).length;
    return `<a class="topic" href="#xlist" data-cat="${t[0]}" aria-expanded="${openCat===t[0]}" aria-controls="xlist"><div class="art a${k+1}"><span>${t[1]}</span></div><div class="tbody"><small>${t[2]}${n?` · ${n} ${L.videos}`:""}</small><b>${t[3]}</b><span>${t[4]}</span></div></a>`}).join("");
  renderList()}
// "More shiurim" list: opens under the cards, newest first; a click plays the video in the big player
let openCat=null,listShown=30;
function renderList(){const box=$("xlist"),L=T[st.ui];
  if(!openCat){box.hidden=true;box.innerHTML="";return}
  const t=L.topics.find(x=>x[0]===openCat),items=EXTRAS[openCat]||[];box.hidden=false;
  box.innerHTML=`<div class="xhead"><b>${esc(t[3])}</b><span>${items.length} ${L.videos}</span><button type="button" class="xclose" data-close>${L.close} ✕</button></div>
  <div class="xitems">${items.slice(0,listShown).map((v,k)=>`<button type="button" class="xitem" data-k="${k}" aria-pressed="${$("player").dataset.vid===v.id}"><img src="https://i.ytimg.com/vi/${encodeURIComponent(v.id)}/mqdefault.jpg" alt="" loading="lazy" width="120" height="68"><span><b dir="auto">${esc(v.t)}</b><small>${fmtDate(v.d)}${v.m?` · ${v.m} ${L.min}`:""}</small></span></button>`).join("")}</div>
  ${items.length>listShown?`<button type="button" class="xmore" data-more>${L.more} (${items.length-listShown})</button>`:""}`}
function fillSelects(){
  const m=SHAS[st.mas];
  $("seder").innerHTML=SEDARIM.map((s,k)=>`<option value="${k}"${k===m.o?" selected":""}>${st.ui==="he"?s[0]:s[1]}</option>`).join("");
  $("mas").innerHTML=SHAS.filter(x=>x.o===m.o).map(x=>`<option value="${x.i}"${x.i===m.i?" selected":""}>${mName(x)}</option>`).join("");
  $("daf").innerHTML=Array.from({length:m.e-m.s+1},(_,k)=>{const d=m.s+k;return `<option value="${d}"${d===st.daf?" selected":""}>${dName(d)}${anyTrack(m,d)?"":" ·"}</option>`}).join("");
}
function render(){
  const L=T[st.ui],m=SHAS[st.mas],tr=TRACKS.find(t=>t.id===st.track),on=has(tr,m,st.daf),isToday=m.i===today.m.i&&st.daf===today.d;
  fillSelects();
  $("eyebrow").textContent=isToday?L.todayEye:L.eye;$("eyebrow").className="eyebrow"+(isToday?" today":"");
  $("title").textContent=`${L.masP} ${mName(m)}`;
  $("dafbox").textContent=gem(st.daf);$("dafbox").hidden=false;
  const v=vidOf(tr,m,st.daf);
  const who=v&&v.s?(L.speakers[v.s]||v.s):(st.ui==="he"?"הרב אלי סטפנסקי":"Rabbi Eli Stefansky");
  $("lsub").textContent=`${who} · ${L.tracks[tr.id]}`;
  $("tracks").innerHTML=TRACKS.map(t=>`<button type="button" data-id="${t.id}" lang="${t.lang}" class="${has(t,m,st.daf)?"":"off"}" aria-pressed="${t.id===st.track}">${L.tracks[t.id]}</button>`).join("");
  const p=$("player");
  p.className="player"+(on?"":" off");
  p.dataset.vid=v?v.id:"";p.dataset.title=v?v.t:"";
  if(on){p.setAttribute("role","button");p.tabIndex=0}else{p.removeAttribute("role");p.removeAttribute("tabindex")}
  p.setAttribute("aria-label",`${m.he} ${gemQ(st.daf)} · ${L.tracks[tr.id]}${on?" · "+L.hint:""}`);
  p.innerHTML=`<div class="pin"><div><div class="pbrand">MERCAZ DAF YOMI</div>${on?'<div class="pplay"></div>':""}<div class="ptitle">${m.he} ${gemQ(st.daf)}</div><div class="pen">${m.en} ${st.daf}</div><div class="phint">${on?L.hint:L.offHint}</div></div></div>`;
  if(on){
    const bits=[fmtDate(v.d)];if(v.m)bits.push(`${v.m} ${L.min}`);if(v.c)bits.push(L.prevCycle);
    const parts=(v.alt||[]).map((a,k)=>`<a href="https://www.youtube.com/watch?v=${a.id}" data-vid="${a.id}" data-title="${esc(a.t)}">${L.part} ${k+2}</a>`).join(" ");
    $("state").innerHTML=esc(bits.join(" · "))+(parts?` · ${L.parts}: ${parts}`:"");
  }else $("state").textContent=L.offState;
  $("state").className="state"+(on?"":" off");
  $("sum").textContent=`${L.grid} ${mName(m)}`;
  $("grid").innerHTML=Array.from({length:m.e-m.s+1},(_,k)=>{const d=m.s+k,t=m.i===today.m.i&&d===today.d,off=!has(tr,m,d);
    return `<button type="button" data-d="${d}" class="${[t?"today":"",off?"off":""].join(" ").trim()}" aria-pressed="${d===st.daf}" aria-label="${m.he} ${gemQ(d)}${off?" · "+L.lgOff:""}">${gem(d)}</button>`}).join("");
  save();
}
function go(mi,d){const m=SHAS[mi];st.mas=mi;st.daf=Math.min(Math.max(d,m.s),m.e);render()}
function step(dir){const m=SHAS[st.mas];let d=st.daf+dir,mi=st.mas;
  if(d>m.e){mi=(mi+1)%SHAS.length;d=SHAS[mi].s}else if(d<m.s){mi=(mi-1+SHAS.length)%SHAS.length;d=SHAS[mi].e}go(mi,d)}

// search
const norm=s=>s.toLowerCase().replace(/[׳״'".\-]/g,"").replace(/^(מסכת|masechta|masechet)\s+/,"").replace(/\s+(דף|daf)\s+/," ").replace(/\s+/g," ").trim();
function parseDaf(s){s=s.replace(/^(דף|daf)\s*/,"").trim();if(!s)return null;if(/^\d+$/.test(s))return +s;if(/^[א-ת]{1,4}$/.test(s)){const n=[...s].reduce((a,c)=>a+(VAL[c]||0),0);return gem(n)===s?n:null}return NaN}
function search(raw){const q=norm(raw);if(!q)return[];const out=[];
  for(const m of SHAS){for(const n of [...m.names].sort((a,b)=>b.length-a.length)){
    if(q===n||q.startsWith(n+" ")){const d=parseDaf(q.slice(n.length).trim());if(d===null)out.push({m,d:m.s});else if(d>=m.s&&d<=m.e)out.push({m,d});break}
    if(!/\s/.test(q)&&n.startsWith(q)&&q.length>=2){out.push({m,d:m.s});break}}}
  return out.slice(0,8)}
let hits=[];
function showHits(){const v=$("q").value.trim(),sr=$("sr");hits=search(v);
  if(!v){sr.hidden=true;return}sr.hidden=false;
  sr.innerHTML=hits.length?hits.map((h,k)=>`<button type="button" data-k="${k}">${h.m.he} · ${gemQ(h.d)} <span style="color:var(--muted)">· ${h.m.en} ${h.d}</span></button>`).join(""):`<div class="none">${T[st.ui].none}</div>`}
function pick(h){go(h.m.i,h.d);$("q").value="";$("sr").hidden=true;$("player").focus()}
$("q").addEventListener("input",showHits);
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"&&hits.length){e.preventDefault();pick(hits[0])}if(e.key==="Escape"){$("q").value="";showHits()}});
$("sr").onclick=e=>{const b=e.target.closest("button");if(b)pick(hits[+b.dataset.k])};
document.addEventListener("click",e=>{if(!e.target.closest(".search"))$("sr").hidden=true});

$("seder").onchange=e=>{const m=SHAS.find(x=>x.o===+e.target.value);go(m.i,m.s)};
$("mas").onchange=e=>{const m=SHAS[+e.target.value];go(m.i,m.s)};
$("daf").onchange=e=>go(st.mas,+e.target.value);
$("tracks").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.track=b.dataset.id;render()};
$("grid").onclick=e=>{const b=e.target.closest("button");if(!b)return;go(st.mas,+b.dataset.d);if(innerWidth<700)$("player").scrollIntoView({behavior:"smooth",block:"center"})};
$("prev").onclick=()=>step(st.ui==="he"?-1:-1);$("next").onclick=()=>step(1);
$("todayBtn").onclick=()=>{go(today.m.i,today.d);$("player").scrollIntoView({behavior:"smooth",block:"center"})};
$("langBtn").onclick=()=>{st.ui=st.ui==="he"?"en":"he";applyUI();render();showUpdated()};

// player: a light placeholder until clicked, then the youtube-nocookie embed plays inside the page
function play(id,title){const p=$("player");if(!id)return;
  p.removeAttribute("role");p.removeAttribute("tabindex");p.classList.add("playing");
  // YouTube needs the page's Referer for embeds (otherwise "error 153"), hence referrerpolicy + origin
  const origin=/^https?:/.test(location.protocol)?`&origin=${encodeURIComponent(location.origin)}`:"";
  p.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0&playsinline=1${origin}" title="${esc(title||"")}" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; fullscreen; web-share"></iframe>`}
$("player").onclick=e=>{const p=$("player");if(!e.target.closest("iframe")&&p.dataset.vid&&!p.querySelector("iframe"))play(p.dataset.vid,p.dataset.title)};
$("player").onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&!$("player").querySelector("iframe")){e.preventDefault();play($("player").dataset.vid,$("player").dataset.title)}};
$("state").onclick=e=>{const a=e.target.closest("a[data-vid]");if(!a)return;e.preventDefault();play(a.dataset.vid,a.dataset.title);$("player").scrollIntoView({behavior:"smooth",block:"center"})};

$("topics").onclick=e=>{const a=e.target.closest(".topic");if(!a)return;e.preventDefault();
  openCat=openCat===a.dataset.cat?null:a.dataset.cat;listShown=30;renderTopics();
  if(openCat)$("xlist").scrollIntoView({behavior:"smooth",block:"start"})};
$("xlist").onclick=e=>{
  if(e.target.closest("[data-close]")){const c=openCat;openCat=null;renderTopics();document.querySelector(`.topic[data-cat="${c}"]`)?.focus();return}
  if(e.target.closest("[data-more]")){listShown+=30;renderList();return}
  const b=e.target.closest(".xitem");if(!b)return;
  const v=EXTRAS[openCat][+b.dataset.k],L=T[st.ui],t=L.topics.find(x=>x[0]===openCat);
  // show the chosen video in the lesson card's player; picking a daf/track again restores the daf view
  $("eyebrow").textContent=L.playing;$("eyebrow").className="eyebrow";$("title").textContent=t[3];$("dafbox").hidden=true;
  $("tracks").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed","false"));
  $("lsub").textContent=v.t;$("state").textContent=`${fmtDate(v.d)}${v.m?` · ${v.m} ${L.min}`:""}`;$("state").className="state";
  $("player").className="player";$("player").dataset.vid=v.id;play(v.id,v.t);renderList();
  $("player").scrollIntoView({behavior:"smooth",block:"center"})};

function showUpdated(){if(!GENERATED)return;const L=T[st.ui],d=new Date(GENERATED);
  $$proto().textContent=`${L.updated}: ${d.toLocaleDateString(st.ui==="he"?"he-IL":"en-US",{day:"numeric",month:"long",year:"numeric"})}`}
const $$proto=()=>document.querySelector(".proto");

applyUI();
fetch("videos.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(j=>{
  VIDEOS=j.tracks||{};EXTRAS=j.extras||{};GENERATED=j.generated;render();renderTopics();showUpdated();
}).catch(()=>{render();$$proto().textContent=T[st.ui].loadErr});
</script>
